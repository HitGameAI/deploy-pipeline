name: Secrets Probe

# 临时诊断用：回答「跨账号调用时 secrets: inherit 到底传不传 secret」
# 不输出任何 secret 值，只输出键名与布尔判定
on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
    secrets:
      FEISHU_WEBHOOK_URL:
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          KEYS: ${{ toJSON(secrets) }}
        run: |
          echo "=== ${{ inputs.label }} ==="
          echo "toJSON(secrets) 的键: $(echo "$KEYS" | python3 -c 'import json,sys; print(list(json.load(sys.stdin).keys()))')"
          echo "按名字取 != '' : ${{ secrets.FEISHU_WEBHOOK_URL != '' }}"
          echo "按名字取 == null : ${{ secrets.FEISHU_WEBHOOK_URL == null }}"
