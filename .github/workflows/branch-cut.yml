name: 🌿 Branch Cut

# ============================================
# 批量切分支工作流（新迭代启动：从最新 master 切 feature/xx）
# 用途：周三发布后定下版本内容，从最新 master 给一批仓库统一切出新 feature 分支
#       （也可用于其他批量切分支场景，如从 master 重建演示分支）
# 触发方式：workflow_dispatch（手动）/ workflow_call（被调用）
# 幂等：目标分支已存在的仓库自动跳过，重复触发安全
# 跨仓库批量操作依赖 BRANCH_OPS_TOKEN（PAT 或 GitHub App token，需覆盖目标仓库）
# 配置优先级：聚合 YAML 的 branch 节 > inputs > vars.BRANCH_OPS_* > 默认值（见 README 配置章节）
# ============================================

on:
  workflow_call:
    inputs:
      repos:
        description: '仓库列表（逗号分隔 owner/repo，留空=按 branch.repos 配置，再为空=当前仓库）'
        required: false
        type: string
        default: ''
      new-branch:
        description: '新分支名（如 feature/xxx）'
        required: true
        type: string
      base-branch:
        description: '基分支'
        required: false
        type: string
        default: 'master'
      dry-run:
        description: '干跑模式（true 只输出动作清单不执行）'
        required: false
        type: boolean
        default: false
      notification-provider:
        description: '通知渠道: feishu | telegram | all | none'
        required: false
        type: string
        default: 'feishu'
    secrets:
      PIPELINE_SECRETS:
        description: '聚合密钥 YAML（notify.* / branch.token），优先级高于下面的单个 secret'
        required: false
      # 这五个必须在这里显式声明，哪怕调用方用了 secrets: inherit
      #
      # inherit 让 secrets.FEISHU_WEBHOOK_URL 这样「按名字取」能拿到值，但
      # toJSON(secrets) **只枚举本块声明过的键**，未声明的继承 secret 不会出现在里面
      # resolve-config 走的正是 toJSON(secrets)，所以不声明就等于那条
      # 「回退到同名单个 secret」的降级路径永远取不到值 —— 而 Notify 步骤的 if:
      # 在取不到时静默跳过、job 照样绿，于是「配了飞书却收不到消息」且无任何报错
      #
      # [EN] These five must be declared here even when the caller passes secrets: inherit.
      # inherit makes secrets.NAME resolvable, but toJSON(secrets) only enumerates the keys
      # declared in this block, and resolve-config reads toJSON(secrets). Without the
      # declaration the standalone-secret fallback can never see them, and the Notify step
      # skips silently while the job stays green
      FEISHU_WEBHOOK_URL:
        description: '飞书通知 Webhook URL'
        required: false
      WECOM_WEBHOOK_URL:
        description: '企业微信群机器人 Webhook URL（完整地址）'
        required: false
      WECOM_WEBHOOK_KEY:
        description: '企业微信群机器人 Webhook key（仅存 key 时用，与 URL 二选一）'
        required: false
      TELEGRAM_BOT_TOKEN:
        description: 'Telegram 通知 Bot Token'
        required: false
      TELEGRAM_CHAT_ID:
        description: 'Telegram 通知 Chat ID'
        required: false
      BRANCH_OPS_TOKEN:
        description: '跨仓库分支操作用的 token（需要 repo 权限；也可写进 PIPELINE_SECRETS 的 branch.token）'
        required: false
  workflow_dispatch:
    inputs:
      repos:
        description: '仓库列表（逗号分隔 owner/repo，留空=按 branch.repos 配置，再为空=当前仓库）'
        required: false
        type: string
        default: ''
      new-branch:
        description: '新分支名（如 feature/xxx）'
        required: true
        type: string
      base-branch:
        description: '基分支'
        required: false
        type: string
        default: 'master'
      dry-run:
        description: '干跑模式（true 只输出动作清单不执行）'
        required: false
        type: boolean
        default: false
      notification-provider:
        description: '通知渠道: feishu | telegram | all | none'
        required: false
        type: string
        default: 'feishu'

jobs:
  branch-cut:
    name: 🌿 Cut Branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 所有配置先过这一步：校验 YAML、合并优先级、写进 GITHUB_ENV
      # 干跑开关不在配置表里，仍只认 input 与 schedule 的判断，见 schema.yaml 里 branch 节的说明
      # [EN] Every setting goes through this step first. The dry-run switch is deliberately not
      # part of the table and still comes from the inputs and the schedule check alone
      - name: ⚙️ Resolve Pipeline Config
        uses: HitGameAI/deploy-pipeline/.github/actions/resolve-config@0c70ed9ef8fd8b81bad3423612fdb99be418ef2e
        with:
          sections: branch notify
          secret-sections: branch notify
          vars-json: ${{ toJSON(vars) }}
          inputs-json: ${{ toJSON(inputs) }}
          # 不能只用 toJSON(secrets)：调用方用 secrets: inherit 时它只枚举出
          # github_token，继承来的键一个都不在里面（实测日志为证），而
          # resolve-config 的「回退到同名单个 secret」正是从这份 JSON 里取值
          # 按名字取 secrets.NAME 在 inherit 下是能拿到值的，所以这里逐个列名
          # 拼 JSON —— 这样调用方无论用 inherit 还是显式映射都能工作，
          # 不必让每个仓库各自改一遍
          #
          # [EN] toJSON(secrets) alone is not enough: under secrets: inherit it enumerates
          # only github_token, while resolve-config reads this JSON for its standalone-secret
          # fallback. Named lookups do resolve under inherit, so the JSON is assembled key by
          # key, which makes both inherit and explicit mapping work without touching callers
          secrets-json: >-
            {
            "PIPELINE_SECRETS": ${{ toJSON(secrets.PIPELINE_SECRETS) }},
            "FEISHU_WEBHOOK_URL": ${{ toJSON(secrets.FEISHU_WEBHOOK_URL) }},
            "WECOM_WEBHOOK_URL": ${{ toJSON(secrets.WECOM_WEBHOOK_URL) }},
            "WECOM_WEBHOOK_KEY": ${{ toJSON(secrets.WECOM_WEBHOOK_KEY) }},
            "TELEGRAM_BOT_TOKEN": ${{ toJSON(secrets.TELEGRAM_BOT_TOKEN) }},
            "TELEGRAM_CHAT_ID": ${{ toJSON(secrets.TELEGRAM_CHAT_ID) }},
            "BRANCH_OPS_TOKEN": ${{ toJSON(secrets.BRANCH_OPS_TOKEN) }}
            }
          defaults: |
            NOTIFICATION_PROVIDER=feishu

      # 不用 actions/checkout 取脚本：被 workflow_call 调用时 checkout 出来的是调用方仓库，
      # 里面没有 scripts/branch-ops.sh（私有仓库也没凭据 checkout 本仓），
      # 所以用 action 自带的仓库副本，理由见 .github/actions/fetch-pipeline-assets
      # [EN] Not actions/checkout: under workflow_call it checks out the calling repository,
      # which does not contain scripts/branch-ops.sh, and a private repository cannot be checked
      # out from here anyway; the action ships its own copy instead
      - name: 📥 Fetch Pipeline Assets (scripts)
        uses: HitGameAI/deploy-pipeline/.github/actions/fetch-pipeline-assets@0c70ed9ef8fd8b81bad3423612fdb99be418ef2e
        with:
          assets: scripts

      - name: Run Branch Cut
        id: ops
        env:
          # 跨仓库批量要 branch.token；没配就回退本次运行的 GITHUB_TOKEN（只够操作当前仓库）
          # [EN] Batch operations need branch.token; without it this run's GITHUB_TOKEN is used,
          # which only reaches the current repository
          GH_TOKEN: ${{ env.BRANCH_OPS_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH_OPS_NEW_BRANCH: ${{ inputs.new-branch }}
          BRANCH_OPS_DRY_RUN: ${{ inputs.dry-run }}
        run: bash _deploy-workflows/scripts/branch-ops.sh cut

      - name: Notify Result
        if: always()
        uses: HitGameAI/deploy-pipeline/.github/actions/notify@0c70ed9ef8fd8b81bad3423612fdb99be418ef2e
        with:
          provider: ${{ env.NOTIFICATION_PROVIDER }}
          status: ${{ steps.ops.outputs.status || 'failure' }}
          title: '🌿 批量切分支结果（${{ env.BRANCH_OPS_BASE }} → ${{ inputs.new-branch }}）'
          message: ${{ steps.ops.outputs.summary || '脚本未产出汇总，请查看日志' }}
