name: 🔬 Self Test

# 这个仓库原先是唯一没有自己 CI 的那个 —— 它被二三十个仓库 uses: 引用，
# 改坏了却要等某个下游仓库的流水线红了才知道，而那时现场已经在别人家
#
# docs/11-self-check.md 曾经是一张手工打勾的清单，勾是人填的、没人回去重跑，
# 于是「每个 workflow 用到的 env 都由它请求的节导出」这种条目一直是 ✅ 而从未验证
# 这条流水线把那些条目变成真跑的断言
#
# [EN] This repository used to be the only one without CI of its own, while two or three dozen
# others reference it through uses:, so a break here surfaced as a red pipeline in someone
# else's repository. The self-check list was ticked by hand and never re-run, which left
# entries such as "every env the workflows use is exported by the sections they request"
# permanently green without ever being verified. This pipeline turns them into real assertions
on:
  push:
    # build 是预览分支：改模板、改脚本推到这里就能跑出产物看效果，不必先开 PR
    # [EN] build is the preview branch: pushing template or script changes there produces the
    # artifact to look at without opening a pull request first
    branches: [master, main, build]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 语法与表达式：未声明的 inputs.xxx 会求值成空串而不报错，
  # 实测两处就是这么静默坏掉的（job 的 environment 没生效、产物保留天数回落成仓库默认）
  # 所以这一步必须是硬闸门，不挂 continue-on-error
  #
  # [EN] Syntax and expressions: an undeclared input evaluates to an empty string instead of
  # failing, which is exactly how two references here broke in silence. This gate therefore
  # carries no continue-on-error
  actionlint:
    name: 🔎 Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🔎 Lint Workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # shell 脚本：scripts/ 下的东西被各工作流直接 source 或执行，
  # 这里的未引用变量与错误的测试写法同样不会在运行时报错，只会给出错的结果
  # [EN] Shell scripts under scripts/ are sourced or executed by the workflows, where an
  # unquoted variable or a wrong test form yields a wrong answer rather than an error
  shellcheck:
    name: 🐚 Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🐚 Check Scripts
        run: |
          mapfile -t files < <(find scripts -name '*.sh' -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning title=没有脚本 | No scripts::scripts 下没有 .sh 文件"
            exit 0
          fi
          printf '待检查 %d 个脚本\n' "${#files[@]}"
          shellcheck --severity=warning "${files[@]}"
          echo "✅ shellcheck 干净"

  # 配置表与文档：断言内容见 scripts/self-test.py
  config-and-docs:
    name: ⚙️ Config And Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # resolve-config.py 与 self-test.py 都要 PyYAML
      # runner 自带的 python 不一定有它，装一次比假设它在更可靠
      # [EN] Both scripts need PyYAML, and the runner's interpreter does not always carry it,
      # so installing it once is more reliable than assuming it is there
      - name: 📦 Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: 🔬 Run Self Test
        run: python3 scripts/self-test.py

  # Python 语法：两个脚本都是在 runner 上现跑的，语法错会在流水线中途才炸
  # [EN] Both scripts run on the runner, where a syntax error only surfaces mid-pipeline
  python-syntax:
    name: 🐍 Python Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🐍 Compile All Scripts
        run: |
          mapfile -t files < <(find scripts -name '*.py' -type f | sort)
          printf '待编译 %d 个脚本\n' "${#files[@]}"
          python3 -m py_compile "${files[@]}"
          echo "✅ 全部能编译"

  # 邮件模板：渲染出来当产物传上去，评审时点开就能看到收件箱里会收到什么
  #
  # 为什么不只做语法检查：模板坏法大多不是语法错 —— 占位符没替换、明细被
  # 重复注入、深色模式下文字和背景同色，这些都能「正常渲染」出一封难看的邮件
  # 实测踩过的一次是注释里把 {{DETAIL_ROWS}} 当文档写，于是明细注入了三遍
  #
  # 走的是 send-email.py 的 --preview，和真实发送同一条渲染路径，不碰 SMTP
  #
  # [EN] The templates are rendered and uploaded as an artifact so a reviewer can see what the
  # inbox will receive. Syntax checks are not enough: the ways a template breaks are mostly not
  # syntax errors but unsubstituted placeholders, duplicated rows, or text the same colour as
  # its dark-mode background, each of which renders a perfectly valid ugly email. One real case
  # was a comment documenting {{DETAIL_ROWS}} by name, which injected the rows three times.
  # It runs send-email.py --preview, the same rendering path as a real send, with no SMTP
  email-templates:
    name: 📧 Email Templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📧 Render Preview
        run: python3 scripts/send-email.py --preview email-preview

      # 占位符和注释残留必须是硬闸门：留在正文里会直接发到收件人眼前
      # [EN] Leftover placeholders and comments are a hard gate: they would reach the recipient
      - name: 🔎 Check Rendered Output
        run: |
          fail=0
          for f in email-preview/*.html; do
            case "$(basename "$f")" in index.html) continue ;; esac
            if grep -qE '\{\{[A-Z_]+\}\}' "$f"; then
              echo "::error file=$f::有未替换的占位符"
              grep -oE '\{\{[A-Z_]+\}\}' "$f" | sort -u | sed 's/^/    /'
              fail=1
            fi
            if grep -q '<!--' "$f"; then
              echo "::error file=$f::有残留的 HTML 注释，应在渲染时剥掉"
              fail=1
            fi
            if [ "$(grep -c '<!DOCTYPE' "$f")" != 1 ]; then
              echo "::error file=$f::DOCTYPE 不是恰好一个，模板可能被重复注入"
              fail=1
            fi
            printf '  %-26s %s\n' "$(basename "$f")" "$(wc -c <"$f" | awk '{printf "%.1f KB", $1/1024}')"
          done
          [ "$fail" = 0 ] || exit 1
          echo "✅ 渲染结果干净"

      - name: 📤 Upload Preview
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: email-preview/
          retention-days: 14
