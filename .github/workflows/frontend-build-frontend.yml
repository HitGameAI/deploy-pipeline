name: 🎨 Build Frontend

# ============================================
# 前端构建工作流
# 用途：自动化构建前端项目，支持 npm、pnpm、yarn 三种包管理器
# 触发方式：通过 workflow_call 被其他工作流调用
# ============================================

on:
  workflow_call:
    inputs:
      # ============================================
      # 必选参数
      # ============================================
      node-version:
        description: 'Node.js 版本'
        required: true
        type: string

      version:
        description: '构建版本号（默认使用 git commit SHA）'
        required: false
        type: string
        default: ''

      build-time:
        description: '构建时间戳（默认使用 run_id）'
        required: false
        type: string
        default: ''

      git-commit:
        description: 'Git commit hash（默认使用当前 SHA）'
        required: false
        type: string
        default: ''

      # ============================================
      # 可选参数
      # ============================================
      package-registry:
        description: '包管理器仓库地址（支持 npm、pnpm、yarn）'
        required: false
        type: string
        default: 'https://registry.npmmirror.com'

      package-manager:
        description: '包管理器类型：npm、pnpm 或 yarn'
        required: false
        type: string
        default: 'npm'

      build-command:
        description: '构建命令（如：npm run build）'
        required: false
        type: string
        default: 'npm run build'

      build-script:
        description: '构建脚本路径（相对仓库根目录）'
        required: false
        type: string
        default: 'scripts/frontend/build-frontend.sh'

      # package.json 不在仓库根时用这个,比如前后端单仓的 web/
      #
      # 装依赖那一步绕不过去:脚本在当前目录跑 npm ci / pnpm install,
      # 而 --build-command 只替换构建那一条命令、--output-dir 只影响产物路径,
      # 两个都改不了装依赖在哪跑 根目录没有 package.json 就直接失败
      #
      # 留空就是现在的行为:在仓库根执行,已有调用方一个都不受影响
      #
      # [EN] For a repository whose package.json is not at the root, such as the web/ half of a
      # monorepo. The install step is the one that cannot be worked around: the script runs
      # npm ci or pnpm install in the current directory, while --build-command only replaces the
      # build command and --output-dir only affects where the artifact is read from, so neither
      # moves the install. Without this it fails outright when the root has no package.json.
      # Empty keeps today's behaviour of running at the repository root
      working-directory:
        description: 'Directory holding package.json when it is not the repository root (e.g. web); empty means the repository root'
        required: false
        type: string
        default: ''
      output-dir:
        description: '构建输出目录'
        required: false
        type: string
        default: 'dist'

      artifact-name:
        description: '构建产物 Artifact 名称（用于多应用并行构建区分）'
        required: false
        type: string
        default: 'frontend-dist'

      pnpm-version:
        description: 'pnpm 版本（仅 package-manager 为 pnpm 时生效）'
        required: false
        type: string
        default: '8'

      retention-days:
        description: '构建产物保留天数（值越小存储占用越低）'
        required: false
        type: string
        default: '7'

      runner:
        description: 'GitHub runner 标签（默认 ubuntu-latest=2核；可选 ubuntu-latest-4-cores/8-cores/16-cores/32-cores 等更大付费 runner）'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  build-frontend:
    name: 🎨 Build Frontend
    runs-on: ${{ inputs.runner }}
    steps:
      # ============================================
      # 步骤1：检出代码仓库
      # ============================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🖥️ Print Runner Info
        uses: HitGameAI/deploy-pipeline/.github/actions/print-runner-info@0c70ed9ef8fd8b81bad3423612fdb99be418ef2e

      # ============================================
      # 步骤2：检出部署工作流仓库（获取脚本）
      # ============================================
      - name: 📥 Checkout Deploy Workflows (for scripts)
        uses: actions/checkout@v6
        with:
          repository: HitGameAI/deploy-pipeline
          ref: 0c70ed9ef8fd8b81bad3423612fdb99be418ef2e
          path: _deploy-workflows
          fetch-depth: 1

      # ============================================
      # 步骤3：安装 pnpm（如果使用 pnpm，需在 setup-node 之前安装以启用缓存）
      # ============================================
      - name: 📦 Install pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v2
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      # ============================================
      # 步骤4：配置 Node.js 环境
      # ============================================
      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          check-latest: true
          cache: ${{ inputs.package-manager }}

      # ============================================
      # 步骤5：执行前端构建
      # ============================================
      - name: 🔨 Build Frontend
        env:
          RESOLVED_VERSION: ${{ inputs.version || github.sha }}
          RESOLVED_GIT_COMMIT: ${{ inputs.git-commit || github.sha }}
        run: |
          RESOLVED_BUILD_TIME="${{ inputs.build-time }}"
          if [ -z "$RESOLVED_BUILD_TIME" ]; then
            RESOLVED_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi

          if [ -f "${GITHUB_WORKSPACE}/${{ inputs.build-script }}" ]; then
            BUILD_SCRIPT="${GITHUB_WORKSPACE}/${{ inputs.build-script }}"
          else
            BUILD_SCRIPT="${GITHUB_WORKSPACE}/_deploy-workflows/scripts/frontend/build-frontend.sh"
          fi
          chmod +x "${BUILD_SCRIPT}"

          # 产物目录对 upload-artifact 要写成仓库根相对路径,而 --output-dir 对脚本
          # 是当前目录相对的 —— 两个基准不同,所以把拼好的那份写进 GITHUB_ENV 给下一步用
          # [EN] upload-artifact reads the path relative to the repository root while
          # --output-dir is relative to the script's own cwd, so the joined form is exported for
          # the next step rather than re-derived there
          if [ -n "${{ inputs.working-directory }}" ]; then
            echo "RESOLVED_ARTIFACT_PATH=${{ inputs.working-directory }}/${{ inputs.output-dir }}" >> "$GITHUB_ENV"
          else
            echo "RESOLVED_ARTIFACT_PATH=${{ inputs.output-dir }}" >> "$GITHUB_ENV"
          fi

          "${BUILD_SCRIPT}" \
            --version "${RESOLVED_VERSION}" \
            --build-time "${RESOLVED_BUILD_TIME}" \
            --git-commit "${RESOLVED_GIT_COMMIT}" \
            --output-dir "${{ inputs.output-dir }}" \
            --node-version "${{ inputs.node-version }}" \
            --package-registry "${{ inputs.package-registry }}" \
            --package-manager "${{ inputs.package-manager }}" \
            --build-command "${{ inputs.build-command }}"

      # ============================================
      # 步骤6：上传构建产物作为 Artifact
      # ============================================
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.RESOLVED_ARTIFACT_PATH }}
          retention-days: ${{ inputs.retention-days }}