name: 🔍 Code Quality Check

on:
  workflow_call:
    inputs:
      module-custody-lock:
        description: 'Optional data-only module custody lock path relative to the caller workspace; empty preserves legacy behavior'
        required: false
        type: string
        default: ''
      # ============================================
      # 可覆盖的静态配置（优先读 vars）
      # ============================================
      go-version:
        description: 'Go version (overrides vars.GO_VERSION)'
        required: false
        type: string
        default: ''
      gotestsum-version:
        description: 'gotestsum version (overrides vars.GOTESTSUM_VERSION)'
        required: false
        type: string
        default: ''
      # 上传覆盖率那步一直在引用这个输入，但从来没声明过
      # 未声明就求值成空串，upload-artifact 于是回落到仓库默认的 90 天，
      # 而文档里写的是 7 天 —— 文档与实现对不上，且没有任何报错提示
      # [EN] The coverage upload step has always referenced this input without declaring it,
      # so it evaluated to an empty string and the upload silently fell back to the
      # repository default instead of the value the documentation promises
      retention-days:
        description: '覆盖率产物保留天数 | Coverage artifact retention in days'
        required: false
        type: string
        default: '7'
      goproxy:
        description: 'Go module proxy (overrides vars.GOPROXY)'
        required: false
        type: string
        default: ''
      goprivate:
        description: 'Go private modules (overrides vars.GOPRIVATE)'
        required: false
        type: string
        default: ''
      go-auth-method:
        description: 'Go private module auth method: app-token | ssh | none'
        required: false
        type: string
        default: ''
    secrets:
      # 聚合密钥：一个 secret 装下私有模块凭证，格式见 scripts/config/schema.yaml
      # [EN] One secret holding the private-module credentials; see scripts/config/schema.yaml
      PIPELINE_SECRETS:
        description: '聚合密钥 YAML（go.app_id / go.app_private_key / go.git_ssh_private_key），优先级高于下面的单个 secret'
        required: false
      APP_ID:
        description: 'GitHub App ID (for app-token auth)'
        required: false
      APP_PRIVATE_KEY:
        description: 'GitHub App Private Key (for app-token auth)'
        required: false
      GIT_SSH_PRIVATE_KEY:
        description: 'Git SSH 私钥内容 (for ssh auth, legacy)'
        required: false

jobs:
  code-quality:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    steps:
      # 所有配置先过这一步：校验 YAML、合并优先级、写进 GITHUB_ENV
      # [EN] Every setting goes through this step first
      - name: ⚙️ Resolve Pipeline Config
        id: config
        uses: HitGameAI/deploy-pipeline/.github/actions/resolve-config@013c0e1efc2b97819ca13f44fe5432be79f58867
        with:
          sections: builder
          secret-sections: go
          vars-json: ${{ toJSON(vars) }}
          inputs-json: ${{ toJSON(inputs) }}
          secrets-json: ${{ toJSON(secrets) }}
          # 质量检查默认不走私有模块认证：公开依赖的仓库不该因为没配 App 就红
          # [EN] The quality check defaults to no private-module auth, so a repository with only
          # public dependencies does not fail for a missing App
          defaults: |
            GO_AUTH_METHOD=none

      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: ${{ inputs.module-custody-lock == '' }}

      - name: 🔑 Generate GitHub App Token
        if: inputs.module-custody-lock == '' && env.GO_AUTH_METHOD == 'app-token'
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: ⚙️ Configure Git for App Token Auth
        if: inputs.module-custody-lock == '' && env.GO_AUTH_METHOD == 'app-token'
        run: |
          git config --global url."https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          if [ -n "${GOPRIVATE}" ]; then
            echo "GOPRIVATE=${GOPRIVATE}" >> "$GITHUB_ENV"
          fi

      - name: 🔑 Setup SSH Key for Private Modules
        if: inputs.module-custody-lock == '' && env.GO_AUTH_METHOD == 'ssh'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.GIT_SSH_PRIVATE_KEY }}

      - name: ⚙️ Configure Git for SSH Auth
        if: inputs.module-custody-lock == '' && env.GO_AUTH_METHOD == 'ssh'
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          if [ -n "${GOPRIVATE}" ]; then
            echo "GOPRIVATE=${GOPRIVATE}" >> "$GITHUB_ENV"
          fi

      - name: 🛠️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ inputs.module-custody-lock == '' }}

      - name: 🔒 Prepare Module Custody
        if: inputs.module-custody-lock != ''
        uses: HitGameAI/deploy-pipeline/.github/actions/prepare-module-custody@7da5e8d622e81eebb0005f5c25612d7aab890ab2
        with:
          mode: prepare
          lock: ${{ inputs.module-custody-lock }}

      # 私有依赖到底看不看得见 —— 在 go mod download 之前先问清楚
      #
      # 不预检的后果是报这么一句：
      #   github.com/acme/foo@v0.0.0-...: invalid version: git ls-remote ... exit status 128:
      #   remote: Repository not found.
      # 读起来像仓库名写错了或者仓库被删了，而真实原因几乎总是另一个：
      # 那个 GitHub App 的仓库清单里没有它 —— GitHub 对无权访问的私有仓库返回 404 而不是 403，
      # 所以「看不见」和「不存在」在报错里长得一模一样
      #
      # 预检只问 GOPRIVATE 匹配到的那几个仓库，公共依赖不问
      #
      # [EN] Whether the private dependencies are visible at all, asked before go mod download.
      # Otherwise the failure reads "remote: Repository not found.", like a wrong name or a deleted
      # repository, while the cause is almost always that the GitHub App's repository list does not
      # include it: GitHub answers 404 rather than 403 for a private repository you cannot see, so
      # invisible and nonexistent look identical. Only the repositories matched by GOPRIVATE are
      # checked.
      - name: 📥 Fetch Pipeline Assets (scripts)
        if: inputs.module-custody-lock == '' && env.GOPRIVATE != '' && steps.app_token.outputs.token != ''
        uses: HitGameAI/deploy-pipeline/.github/actions/fetch-pipeline-assets@013c0e1efc2b97819ca13f44fe5432be79f58867
        with:
          assets: scripts

      - name: 🧭 私有依赖可达性预检
        if: inputs.module-custody-lock == '' && env.GOPRIVATE != '' && steps.app_token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: bash _deploy-workflows/scripts/check-private-modules.sh go.mod

      - name: 📦 Download Dependencies
        run: |
          export GOPROXY="${{ env.GOPROXY }}"
          if [ -n "${{ env.GOPRIVATE }}" ]; then
            export GOPRIVATE="${{ env.GOPRIVATE }}"
          fi
          go mod download

      - name: 🔒 Verify Module Custody Before Execution
        if: inputs.module-custody-lock != ''
        uses: HitGameAI/deploy-pipeline/.github/actions/prepare-module-custody@7da5e8d622e81eebb0005f5c25612d7aab890ab2
        with:
          mode: guard

      - name: ✨ Format Check (gofmt)
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Files needing formatting:"
            gofmt -s -l .
            exit 1
          fi

      - name: 🔍 Vet Check
        run: go vet ./...

      - name: 📦 Install gotestsum
        run: go install gotest.tools/gotestsum@${{ env.GOTESTSUM_VERSION }}

      - name: 🧪 Run Tests with Coverage
        run: gotestsum -f testname -- ./... -race -count=1 -coverprofile=coverage -covermode=atomic -shuffle=on
        continue-on-error: true

      - name: 📊 Generate Coverage Report
        if: always()
        run: |
          if [ -f coverage ]; then
            go tool cover -html=coverage -o coverage.html
          fi

      - name: 📤 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage
            coverage.html
          retention-days: ${{ inputs.retention-days }}

      - name: 🧹 Verify and Clean Module Custody
        if: always() && inputs.module-custody-lock != ''
        uses: HitGameAI/deploy-pipeline/.github/actions/prepare-module-custody@7da5e8d622e81eebb0005f5c25612d7aab890ab2
        with:
          mode: cleanup

      - name: 📤 Upload Module Custody Evidence
        if: always() && inputs.module-custody-lock != ''
        uses: actions/upload-artifact@v4
        with:
          name: module-custody-code-quality-evidence-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/module-custody-acquisition.json
            ${{ runner.temp }}/module-custody-early-failure.json
            ${{ runner.temp }}/module-custody-cleanup.json
          if-no-files-found: error
          retention-days: 7
