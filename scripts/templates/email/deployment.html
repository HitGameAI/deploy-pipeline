<!--
  场景：部署 / 回滚（成功与失败共用，差异只在状态色、图标和文案）
  [EN] Scenario: deploy and rollback, success and failure sharing one layout

  明细行由 send-email.py 生成后注入 {{DETAIL_ROWS}}：哪些字段有值由调用方决定，
  条件判断放在 Python 里，模板只管排版，不做模板语言那套 if/each
  [EN] The detail rows are generated by send-email.py and injected at {{DETAIL_ROWS}}. Which
  fields are present is up to the caller, so the conditionals live in Python and the template
  only carries layout rather than a template language's if/each
-->
<tr>
  <td class="px" style="padding:0 36px;">

    <!-- 服务与环境 -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:22px;">
      <tr>
        <td style="vertical-align:middle;">
          <span class="ink" style="font-size:17px;font-weight:600;color:#1b2027;">{{SERVICE}}</span>
        </td>
        <td align="right" style="vertical-align:middle;">
          <span style="display:inline-block;font-size:12px;font-weight:500;color:{{ENV_COLOR}};background:{{ENV_BG}};border:1px solid {{ENV_COLOR}};border-radius:999px;padding:3px 12px;white-space:nowrap;">{{ENV_LABEL}}</span>
        </td>
      </tr>
    </table>

    {{ERROR_BLOCK}}

    <!-- 明细 -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="rule" style="border:1px solid #e9edf1;border-radius:10px;">
      {{DETAIL_ROWS}}
    </table>

    {{BUTTON}}

  </td>
</tr>
