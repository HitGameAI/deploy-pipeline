# ============================================
# 后端服务 Deployment/StatefulSet/DaemonSet 模板
# 使用方式: envsubst < templates/k8s/backend/deployment.yaml > output.yaml
# ============================================
apiVersion: apps/v1
kind: ${KIND}
metadata:
  name: ${APP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${APP_NAME}
    tier: backend
spec:
  replicas: ${REPLICAS}
  revisionHistoryLimit: ${REVISION_HISTORY_LIMIT}
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
        tier: backend
${ANNOTATIONS_BLOCK}
    spec:
      # 终止宽限期：必须 >= 服务优雅停机最大超时（如 go-wsc shutdown-max-timeout 60s），
      # 否则 kubelet 到点 SIGKILL，剩余长连接收到裸 RST 而非 close 1001
      terminationGracePeriodSeconds: ${TERMINATION_GRACE_PERIOD_SECONDS}
      containers:
      - name: ${APP_NAME}
        image: ${IMAGE_NAME}
        imagePullPolicy: ${IMAGE_PULL_POLICY}
        env:
        - name: APP_ENV
          value: "${RUN_MODE}"
        # 工作目录与数据目录：代码里要拼绝对路径时用这两个，别各处硬编码
        # 以后改 kube.run_workdir 只改一处，这里跟着变
        # [EN] Workdir and data directory for code that needs an absolute path, instead of
        # hardcoding it in several places; changing kube.run_workdir updates both
        - name: APP_WORKDIR
          value: "${APP_WORKDIR}"
        - name: APP_DATA_DIR
          value: "${APP_DATA_DIR}"
${GOMEMLIMIT_ENV_BLOCK}${EXTRA_ENV_BLOCK}        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]
        ports:
${DEPLOY_HTTP_PORT_BLOCK}
${DEPLOY_RPC_PORT_BLOCK}
${DEPLOY_WS_PORT_BLOCK}
${DEPLOY_PPROF_PORT_BLOCK}
${DEPLOY_NODE_GRPC_PORT_BLOCK}
${STARTUP_PROBE_BLOCK}
${READINESS_PROBE_BLOCK}
${LIVENESS_PROBE_BLOCK}
        resources:
          requests:
            cpu: ${CPU_REQUEST}
            memory: ${MEMORY_REQUEST}
          limits:
            cpu: ${CPU_LIMIT}
            memory: ${MEMORY_LIMIT}
        volumeMounts:
        - name: config
          mountPath: ${CONFIG_MOUNT_PATH}
          readOnly: true
      volumes:
      # projected 而不是单个 configMap：配置可能来自两处 —— 明文那份在 ConfigMap 里，
      # 配置仓库里加密的那份解开后在 Secret 里（ConfigMap 在集群里明文可读，不能放解密结果）
      # 两者挂到同一个目录、文件名不变，服务读到的路径与只有 ConfigMap 时完全一样
      # 两个来源都 optional：任一侧不存在时 Pod 仍能启动，由服务自己报缺哪份配置
      #
      # [EN] A projected volume rather than a single configMap source: config can come from two
      # places, the plaintext half in a ConfigMap and the half that was encrypted in the config
      # repository in a Secret, since a ConfigMap is readable in plaintext in-cluster and must not
      # hold decrypted values. Both land in one directory under their own names, so the paths the
      # service reads are identical to the ConfigMap-only case. Both sources are optional so the
      # Pod still starts when one is absent and the service itself reports what is missing.
      - name: config
        projected:
          sources:
          - configMap:
              name: ${CONFIGMAP_NAME}
              optional: true
${CONFIG_FILES_SOURCE_BLOCK}
      imagePullSecrets:
      - name: ${IMAGE_PULL_SECRETS}